<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#050b1a" media="(prefers-color-scheme: dark)" />
    <script>
      // apply the saved or system theme before the first paint, so there is no flash of the wrong theme
      try { var t = localStorage.getItem('theme'); if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.classList.add(t); document.documentElement.style.colorScheme = t; } catch (e) {}
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Oliskey — Bring your business to the world and reach more customers</title>
    <meta name="description" content="Bring your business to the world and reach more customers. Work smarter and grow your business with Oliskey apps for schools, transport operators and traders: Oliskey School, Fleet, Alpha and Labs." />
    <!--seo-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
